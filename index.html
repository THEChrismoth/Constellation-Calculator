<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Созвездий 3x3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #05060f;
            --bg-mid: #0b1030;
            --glass: rgba(18, 22, 52, 0.55);
            --glass-border: rgba(140, 160, 255, 0.18);
            --text: #e8ecff;
            --text-muted: #8f97c4;
            --accent: #8b7bff;
            --accent-2: #4fd1ff;
            --gold: #ffd98a;
            --star-on: #fff6dc;
            --radius: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 32px 16px;
            color: var(--text);
            background:
                radial-gradient(ellipse at 20% 10%, rgba(139, 123, 255, 0.25), transparent 50%),
                radial-gradient(ellipse at 85% 90%, rgba(79, 209, 255, 0.18), transparent 55%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Звёздное небо на фоне */
        #sky {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            position: relative;
            max-width: 560px;
            margin: 0 auto;
            padding: 32px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            margin-bottom: 14px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--gold);
            background: rgba(255, 217, 138, 0.08);
            border: 1px solid rgba(255, 217, 138, 0.25);
            border-radius: 999px;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.02em;
            background: linear-gradient(120deg, #ffffff 0%, #c9c2ff 45%, var(--accent-2) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 14px;
        }

        .steps-hint {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .steps-hint span {
            font-size: 13px;
            color: var(--text-muted);
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }

        .steps-hint b {
            color: var(--accent-2);
            margin-right: 4px;
        }

        /* Игровое поле */
        .board-container {
            display: flex;
            justify-content: center;
            margin: 8px 0 20px;
        }

        .board {
            position: relative;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            padding: 26px;
            border-radius: 24px;
            background: radial-gradient(circle at 50% 40%, rgba(139, 123, 255, 0.12), rgba(5, 6, 15, 0.6) 70%);
            border: 1px solid var(--glass-border);
        }

        /* Линии созвездия между соседями */
        .board svg.links {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .board svg.links line {
            stroke: rgba(160, 170, 255, 0.18);
            stroke-width: 1.5;
            stroke-dasharray: 3 5;
            transition: stroke 0.3s ease;
        }

        .board svg.links line.lit {
            stroke: rgba(255, 230, 170, 0.55);
            stroke-dasharray: none;
        }

        .circle {
            position: relative;
            z-index: 1;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 22px;
            cursor: pointer;
            user-select: none;
            border: none;
            font-family: inherit;
            transition: transform 0.25s cubic-bezier(.2, .9, .3, 1.3), box-shadow 0.35s ease, background 0.35s ease, color 0.35s ease;
        }

        .circle:hover {
            transform: scale(1.08);
        }

        .circle:active {
            transform: scale(0.95);
        }

        .circle:focus-visible {
            outline: 2px solid var(--accent-2);
            outline-offset: 4px;
        }

        .circle.black {
            background: radial-gradient(circle at 35% 30%, #2a2f5a, #0c0f24 70%);
            color: #6f78ad;
            box-shadow:
                inset 0 0 0 1px rgba(140, 160, 255, 0.25),
                0 6px 18px rgba(0, 0, 0, 0.5);
        }

        .circle.white {
            background: radial-gradient(circle at 40% 35%, #ffffff, var(--star-on) 45%, var(--gold) 100%);
            color: #2a2140;
            box-shadow:
                0 0 0 1px rgba(255, 240, 200, 0.8),
                0 0 24px rgba(255, 220, 140, 0.65),
                0 0 60px rgba(255, 200, 120, 0.35);
        }

        .circle.highlight {
            animation: pulse 0.9s ease-in-out infinite;
        }

        .circle.flash {
            animation: flash 0.45s ease;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 2px var(--accent-2), 0 0 24px rgba(79, 209, 255, 0.6); }
            50%      { box-shadow: 0 0 0 5px var(--accent-2), 0 0 40px rgba(79, 209, 255, 0.9); }
        }

        @keyframes flash {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        /* Статус */
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .status .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot.on  { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
        .dot.off { background: #2a2f5a; box-shadow: inset 0 0 0 1px rgba(140, 160, 255, 0.4); }

        .status b {
            color: var(--text);
        }

        /* Кнопки */
        .controls {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .btn {
            padding: 13px 16px;
            border-radius: 14px;
            font-family: inherit;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.15s ease, box-shadow 0.25s ease, background 0.25s ease, border-color 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent-2);
            outline-offset: 2px;
        }

        .btn-black {
            color: var(--text);
            background: linear-gradient(135deg, #1d2250, #0e1130);
            border-color: rgba(140, 160, 255, 0.3);
        }

        .btn-black:hover {
            box-shadow: 0 8px 24px rgba(139, 123, 255, 0.35);
            border-color: var(--accent);
        }

        .btn-white {
            color: #2a2140;
            background: linear-gradient(135deg, #ffffff, var(--gold));
            box-shadow: 0 4px 18px rgba(255, 217, 138, 0.25);
        }

        .btn-white:hover {
            box-shadow: 0 8px 28px rgba(255, 217, 138, 0.5);
        }

        .btn-clear {
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
            padding: 13px 18px;
        }

        .btn-clear:hover {
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* Решение */
        .solution h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .solution h3::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--glass-border), transparent);
        }

        .solution-box {
            padding: 18px;
            min-height: 120px;
            max-height: 340px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-muted);
            background: rgba(5, 6, 15, 0.45);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
        }

        .solution-box p + p {
            margin-top: 10px;
        }

        .solution-box .success {
            color: #8ff0c0;
        }

        .solution-box .error {
            color: #ff9aa8;
        }

        .sequence {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin: 14px 0;
        }

        .sequence .chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 15px;
            color: var(--text);
            background: linear-gradient(135deg, rgba(139, 123, 255, 0.35), rgba(79, 209, 255, 0.25));
            border: 1px solid rgba(139, 123, 255, 0.5);
            cursor: default;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .sequence .chip:hover,
        .sequence .chip.active {
            transform: scale(1.12);
            box-shadow: 0 0 18px rgba(79, 209, 255, 0.6);
        }

        .sequence .arrow {
            color: rgba(160, 170, 255, 0.5);
        }

        .step {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.025);
            border-left: 2px solid var(--accent);
        }

        .step .num {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            min-width: 18px;
        }

        .step b {
            color: var(--text);
        }

        .btn-play {
            margin-top: 12px;
            width: 100%;
            color: var(--text);
            background: linear-gradient(135deg, rgba(139, 123, 255, 0.35), rgba(79, 209, 255, 0.25));
            border-color: rgba(139, 123, 255, 0.5);
        }

        .btn-play:hover {
            box-shadow: 0 8px 24px rgba(79, 209, 255, 0.3);
        }

        .btn-play:disabled {
            opacity: 0.5;
            cursor: wait;
            transform: none;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 12px;
            color: rgba(143, 151, 196, 0.6);
        }

        .solution-box::-webkit-scrollbar {
            width: 6px;
        }

        .solution-box::-webkit-scrollbar-thumb {
            background: rgba(139, 123, 255, 0.4);
            border-radius: 3px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 22px 16px;
                border-radius: 22px;
            }

            .title {
                font-size: 24px;
            }

            .board {
                gap: 16px;
                padding: 18px;
            }

            .circle {
                width: 70px;
                height: 70px;
                font-size: 19px;
            }

            .controls {
                grid-template-columns: 1fr 1fr;
            }

            .btn-clear {
                grid-column: 1 / -1;
                order: 3;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <canvas id="sky"></canvas>

    <div class="container">
        <div class="header">
            <div class="badge">✦ Головоломка 3×3</div>
            <h1 class="title">Калькулятор Созвездий</h1>
            <div class="steps-hint">
                <span><b>1</b>Отметьте горящие звёзды</span>
                <span><b>2</b>Выберите цель</span>
            </div>
        </div>

        <div class="board-container">
            <div class="board" id="gameBoard">
                <!-- Круги будут созданы JavaScript -->
            </div>
        </div>

        <div class="status" id="status"></div>

        <div class="controls">
            <button class="btn btn-black" id="solveBlack">☾ Все тёмные</button>
            <button class="btn btn-clear" id="clearBoard" title="Сбросить поле">↺ Сброс</button>
            <button class="btn btn-white" id="solveWhite">✦ Все светлые</button>
        </div>

        <div class="solution">
            <h3>Решение</h3>
            <div class="solution-box" id="solutionText"></div>
        </div>

        <div class="footer">Нажатие на созвездие переключает его и соседей сверху, снизу, слева и справа</div>
    </div>

    <script>
        // Модель игровой доски 3x3 (0 - черный, 1 - белый)
        let board = [
            [0, 0, 0],
            [0, 0, 0],
            [0, 0, 0]
        ];

        // Последнее найденное решение (для анимации)
        let lastSolution = null;
        let isPlaying = false;

        // Инициализация игрового поля
        function initializeBoard() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';

            // Линии созвездия между соседними клетками
            const svgNS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(svgNS, 'svg');
            svg.classList.add('links');
            gameBoard.appendChild(svg);

            // Создаем 9 кругов для игрового поля
            for (let i = 0; i < 9; i++) {
                const circle = document.createElement('button');
                circle.type = 'button';
                circle.className = 'circle black';
                circle.textContent = i + 1;
                circle.dataset.index = i;
                circle.setAttribute('aria-label', `Созвездие ${i + 1}`);

                // Обработчик клика по кругу
                circle.addEventListener('click', () => toggleCell(i));

                gameBoard.appendChild(circle);
            }

            drawLinks();
            window.addEventListener('resize', drawLinks);
            updateCircleColors();
        }

        // Рисование линий между соседними клетками
        function drawLinks() {
            const gameBoard = document.getElementById('gameBoard');
            const svg = gameBoard.querySelector('svg.links');
            const circles = gameBoard.querySelectorAll('.circle');
            const boardRect = gameBoard.getBoundingClientRect();
            svg.innerHTML = '';

            const centers = Array.from(circles).map(circle => {
                const r = circle.getBoundingClientRect();
                return {
                    x: r.left - boardRect.left + r.width / 2,
                    y: r.top - boardRect.top + r.height / 2
                };
            });

            for (let i = 0; i < 9; i++) {
                const neighbors = [];
                if (i % 3 < 2) neighbors.push(i + 1);
                if (i < 6) neighbors.push(i + 3);

                for (const j of neighbors) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', centers[i].x);
                    line.setAttribute('y1', centers[i].y);
                    line.setAttribute('x2', centers[j].x);
                    line.setAttribute('y2', centers[j].y);
                    line.dataset.a = i;
                    line.dataset.b = j;
                    svg.appendChild(line);
                }
            }

            updateLinks();
        }

        // Подсветка линий между двумя горящими звёздами
        function updateLinks() {
            document.querySelectorAll('.board svg.links line').forEach(line => {
                const a = +line.dataset.a;
                const b = +line.dataset.b;
                const lit = board[Math.floor(a / 3)][a % 3] === 1 && board[Math.floor(b / 3)][b % 3] === 1;
                line.classList.toggle('lit', lit);
            });
        }

        // Переключение состояния клетки
        function toggleCell(cellIndex) {
            if (isPlaying) return;

            const row = Math.floor(cellIndex / 3);
            const col = cellIndex % 3;

            // Инвертируем состояние клетки (0 -> 1, 1 -> 0)
            board[row][col] = 1 - board[row][col];

            updateCircleColors();
            updateStatus();
        }

        // Обновление цветов кругов в соответствии с состоянием доски
        function updateCircleColors() {
            const circles = document.querySelectorAll('.circle');

            circles.forEach((circle, index) => {
                const row = Math.floor(index / 3);
                const col = index % 3;

                if (board[row][col] === 1) {
                    circle.classList.remove('black');
                    circle.classList.add('white');
                } else {
                    circle.classList.remove('white');
                    circle.classList.add('black');
                }
            });

            updateLinks();
        }

        // Обновление текста статуса
        function updateStatus() {
            const statusElement = document.getElementById('status');
            let whiteCount = 0;

            // Подсчитываем количество белых клеток
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (board[i][j] === 1) whiteCount++;
                }
            }

            const blackCount = 9 - whiteCount;

            statusElement.innerHTML = `
                <span class="pill"><span class="dot on"></span>Светлых <b>${whiteCount}</b></span>
                <span class="pill"><span class="dot off"></span>Тёмных <b>${blackCount}</b></span>
            `;
        }

        // Очистка доски (все черные)
        function clearBoard() {
            if (isPlaying) return;

            board = [
                [0, 0, 0],
                [0, 0, 0],
                [0, 0, 0]
            ];

            updateCircleColors();
            updateStatus();
            showUniversalSequence();
        }

        // Разметка последовательности в виде «чипов»
        function renderSequence(sequence) {
            return `<div class="sequence">${sequence
                .map(n => `<span class="chip" data-cell="${n - 1}">${n}</span>`)
                .join('<span class="arrow">→</span>')}</div>`;
        }

        // Подсветка клетки при наведении на шаг решения
        function bindChipHighlight() {
            const circles = document.querySelectorAll('.circle');
            document.querySelectorAll('.solution-box [data-cell]').forEach(el => {
                const circle = circles[+el.dataset.cell];
                el.addEventListener('mouseenter', () => circle.classList.add('highlight'));
                el.addEventListener('mouseleave', () => circle.classList.remove('highlight'));
            });
        }

        // Показать универсальную последовательность
        function showUniversalSequence() {
            lastSolution = null;
            const solutionText = document.getElementById('solutionText');
            solutionText.innerHTML = `
                <p>Универсальная последовательность для полной смены цвета:</p>
                ${renderSequence([1, 9, 5, 3, 7])}
                <p>Эта последовательность меняет все созвездия на противоположный цвет.</p>
            `;
            bindChipHighlight();
        }

        // Поиск решения для целевого цвета
        function solveBoard(targetColor) {
            if (isPlaying) return;

            const solutionText = document.getElementById('solutionText');
            const currentState = JSON.parse(JSON.stringify(board)); // Глубокая копия
            const targetText = targetColor === 1 ? 'светлыми' : 'тёмными';

            // Проверка, не достигнуто ли уже целевое состояние
            if (isBoardInState(currentState, targetColor)) {
                lastSolution = null;
                solutionText.innerHTML = `<p class="success">✓ Все созвездия уже стали ${targetText}!</p>`;
                return;
            }

            // Поиск последовательности ходов
            const solution = findSolution(currentState, targetColor);

            if (solution) {
                lastSolution = solution;
                let solutionHTML = `
                    <p>Чтобы все созвездия стали <b>${targetText}</b>, нажмите:</p>
                    ${renderSequence(solution)}
                `;

                solution.forEach((step, index) => {
                    solutionHTML += `<div class="step" data-cell="${step - 1}"><span class="num">${index + 1}</span>Нажмите на созвездие <b>${step}</b></div>`;
                });

                solutionHTML += `<button class="btn btn-play" id="playSolution">▶ Показать на поле</button>`;

                solutionText.innerHTML = solutionHTML;
                document.getElementById('playSolution').addEventListener('click', playSolution);
                bindChipHighlight();
            } else {
                lastSolution = null;
                solutionText.innerHTML = `<p class="error">Решение не найдено! Попробуйте другую цель.</p>`;
            }
        }

        // Пошаговая анимация найденного решения на поле
        async function playSolution() {
            if (!lastSolution || isPlaying) return;

            isPlaying = true;
            const playButton = document.getElementById('playSolution');
            playButton.disabled = true;

            const circles = document.querySelectorAll('.circle');
            const chips = document.querySelectorAll('.sequence .chip');
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

            for (let i = 0; i < lastSolution.length; i++) {
                const cellIndex = lastSolution[i] - 1;
                chips.forEach(chip => chip.classList.remove('active'));
                chips[i].classList.add('active');
                circles[cellIndex].classList.add('highlight');
                await wait(450);

                applyGameMove(board, cellIndex);
                circles[cellIndex].classList.remove('highlight');
                circles.forEach(circle => circle.classList.remove('flash'));
                getAffectedCells(cellIndex).forEach(idx => circles[idx].classList.add('flash'));
                updateCircleColors();
                updateStatus();
                await wait(550);
            }

            chips.forEach(chip => chip.classList.remove('active'));
            circles.forEach(circle => circle.classList.remove('flash'));
            playButton.textContent = '✓ Готово';
            isPlaying = false;
        }

        // Клетки, затрагиваемые ходом
        function getAffectedCells(cellIndex) {
            const row = Math.floor(cellIndex / 3);
            const col = cellIndex % 3;
            const cells = [cellIndex];
            for (const [dr, dc] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
                const r = row + dr;
                const c = col + dc;
                if (r >= 0 && r < 3 && c >= 0 && c < 3) cells.push(r * 3 + c);
            }
            return cells;
        }

        // Проверка, находится ли доска в целевом состоянии
        function isBoardInState(boardState, targetColor) {
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (boardState[i][j] !== targetColor) {
                        return false;
                    }
                }
            }
            return true;
        }

        // Поиск минимальной последовательности ходов
        function findSolution(initialBoard, targetColor) {
            // Перебираем все возможные комбинации ходов от 1 до 9
            for (let moves = 1; moves <= 9; moves++) {
                const sequences = generateCombinations(9, moves);

                for (const sequence of sequences) {
                    const testBoard = JSON.parse(JSON.stringify(initialBoard));

                    // Применяем последовательность ходов к тестовой доске
                    for (const move of sequence) {
                        applyGameMove(testBoard, move);
                    }

                    // Проверяем, достигнута ли цель
                    if (isBoardInState(testBoard, targetColor)) {
                        return sequence.map(move => move + 1); // Возвращаем номера созвездий (1-9)
                    }
                }
            }

            return null;
        }

        // Генерация всех комбинаций длины k из n элементов
        function generateCombinations(n, k) {
            const result = [];

            function backtrack(start, current) {
                if (current.length === k) {
                    result.push([...current]);
                    return;
                }

                for (let i = start; i < n; i++) {
                    current.push(i);
                    backtrack(i + 1, current);
                    current.pop();
                }
            }

            backtrack(0, []);
            return result;
        }

        // Применение хода к доске
        function applyGameMove(boardState, cellIndex) {
            const row = Math.floor(cellIndex / 3);
            const col = cellIndex % 3;

            // Инвертируем выбранную клетку
            boardState[row][col] = 1 - boardState[row][col];

            // Инвертируем соседние клетки (верх, право, низ, лево)
            const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];

            for (const [dr, dc] of directions) {
                const newRow = row + dr;
                const newCol = col + dc;

                if (newRow >= 0 && newRow < 3 && newCol >= 0 && newCol < 3) {
                    boardState[newRow][newCol] = 1 - boardState[newRow][newCol];
                }
            }

            return boardState;
        }

        // Анимированное звёздное небо на фоне
        function initSky() {
            const canvas = document.getElementById('sky');
            const ctx = canvas.getContext('2d');
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let stars = [];

            function resize() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const count = Math.floor((window.innerWidth * window.innerHeight) / 4500);
                stars = Array.from({ length: count }, () => ({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    r: Math.random() * 1.3 + 0.2,
                    phase: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.02 + 0.005
                }));
            }

            function draw() {
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                for (const star of stars) {
                    star.phase += star.speed;
                    const alpha = 0.35 + Math.sin(star.phase) * 0.35 + 0.3;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(220, 225, 255, ${alpha})`;
                    ctx.fill();
                }
                if (!reduceMotion) requestAnimationFrame(draw);
            }

            resize();
            window.addEventListener('resize', resize);
            draw();
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            initSky();
            initializeBoard();
            updateStatus();
            showUniversalSequence();

            // Назначение обработчиков для кнопок
            document.getElementById('solveBlack').addEventListener('click', () => solveBoard(0));
            document.getElementById('solveWhite').addEventListener('click', () => solveBoard(1));
            document.getElementById('clearBoard').addEventListener('click', clearBoard);
        });

        // Шрифты могут сдвинуть раскладку — перерисовываем линии
        window.addEventListener('load', drawLinks);
    </script>
</body>
